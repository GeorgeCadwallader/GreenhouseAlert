name: Check wind

on:
  schedule:
    # Every 15 minutes (GitHub cron uses UTC)
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore state file from state branch
        run: |
          mkdir -p state
          if git ls-remote --heads origin state | grep -q state; then
            git fetch origin state
            git show origin/state:state.json > state/state.json 2>/dev/null || \
              echo '{"current":{"lastRunAt":null,"lastBreach":null},"history":[]}' > state/state.json
          else
            echo '{"current":{"lastRunAt":null,"lastBreach":null},"history":[]}' > state/state.json
          fi

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run wind check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LOCATION_LAT: ${{ secrets.LOCATION_LAT }}
          LOCATION_LON: ${{ secrets.LOCATION_LON }}
        run: node src/check.js

      - name: Push state to state branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --heads origin state | grep -q state; then
            git fetch origin state
            git checkout -B state-push origin/state
          else
            git checkout --orphan state-push
            git rm -rf . 2>/dev/null || true
          fi

          cp "${GITHUB_WORKSPACE}/state/state.json" ./state.json
          git add state.json

          if git diff --staged --quiet; then
            echo "No state changes to push"
            exit 0
          fi

          git commit -m "state: update [skip ci]"
          git push origin HEAD:state
